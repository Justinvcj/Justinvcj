name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Classic Stats (Replaces Vercel Stats)
        uses: lowlighter/metrics@latest
        with:
          filename: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_branch: profile-assets

      - name: Generate Isometric Calendar (Replaces Streak)
        uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          output_action: commit
          committer_branch: profile-assets

      - name: Generate Achievements (Replaces Trophies)
        uses: lowlighter/metrics@latest
        with:
          filename: achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          output_action: commit
          committer_branch: profile-assets

  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Justinvcj
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            
      - name: Push Snake to Assets Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: profile-assets
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
